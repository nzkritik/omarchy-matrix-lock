# Rebuilds rain.frag.qsb from rain.frag and fails unless the result is
# byte-identical to the committed file, so the shipped shader can be traced to
# its source. On main the rebuilt bytes also get a signed build-provenance
# attestation; check the committed file against it with
#   gh attestation verify rain.frag.qsb --repo nzkritik/omarchy-matrix-lock
name: Shader provenance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    # qsb comes from a dated Arch Linux Archive snapshot, so every run uses
    # the same qt6-shadertools (6.12.0-1).
    container: archlinux:base
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Install qsb from the pinned snapshot
        run: |
          echo 'Server = https://archive.archlinux.org/repos/2026/10/19/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm qt6-shadertools diffutils
          pacman -Q qt6-shadertools

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rebuild and compare
        run: |
          mkdir rebuilt
          tools/build-shaders.sh rebuilt/rain.frag.qsb
          sha256sum rain.frag.qsb rebuilt/rain.frag.qsb
          cmp rain.frag.qsb rebuilt/rain.frag.qsb

      - name: Attest the rebuilt shader
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rebuilt/rain.frag.qsb
